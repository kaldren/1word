name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**' # only fires when website files change

# Newer push to website cancels any in-flight deploy
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write # wrangler-action creates a GitHub Deployment record

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Static HTML — no build step needed.
      # Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
      # CLOUDFLARE_API_TOKEN must have "Cloudflare Pages:Edit" permission.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=lingering-darkness-62fe --branch=main
