name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # allows release.yml to call this as a required gate

jobs:
  # ── Secret scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: TruffleHog secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: none

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history needed for diff mode

      - name: TruffleHog scan
        # On PR: scan commits added by this PR vs base branch
        # On push: scan commits since previous SHA
        # On workflow_call (from release): base/head empty → scans full repo
        uses: trufflesecurity/trufflehog@6f84c70c04c6bb1df7e3b2fc56ebea8c45d1cfb1 # v3.88.27
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.event.after || '') }}
          extra_args: --only-verified

  # ── Dependency vulnerability audit ──────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: none

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on HIGH or CRITICAL CVEs across all workspaces (root lockfile covers all)
      - name: Run npm audit
        run: npm audit --audit-level=high

  # ── SAST — CodeQL ────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # CodeQL dataflow analysis needs full history

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.9
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.9
        with:
          category: '/language:javascript-typescript'
