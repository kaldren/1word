name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # allows release.yml to call this as a required gate

jobs:
  # ── Secret scanning (native grep — no external action) ───────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan diff for hardcoded secrets
        run: |
          # Determine the range of new lines to scan
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              -- . ':(exclude)package-lock.json' | grep '^+' | grep -v '^+++')
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff "${{ github.event.before }}" "${{ github.event.after }}" \
              -- . ':(exclude)package-lock.json' | grep '^+' | grep -v '^+++')
          else
            # Initial push or workflow_call: scan the latest commit
            DIFF=$(git show HEAD -- . ':(exclude)package-lock.json' | grep '^+' | grep -v '^+++')
          fi

          FOUND=0
          check() {
            if echo "$DIFF" | grep -qiE "$1"; then
              echo "ALERT: possible $2 detected"
              FOUND=1
            fi
          }

          check 'AKIA[0-9A-Z]{16}'                           'AWS access key'
          check 'sk-[a-zA-Z0-9]{48}'                         'OpenAI API key'
          check '(sk|pk)_(live|test)_[a-zA-Z0-9]+'          'Stripe key'
          check 'ghp_[a-zA-Z0-9]{36}'                        'GitHub PAT'
          check 'whsec_[a-zA-Z0-9]+'                         'Stripe webhook secret'
          check '-----BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY' 'private key'
          check 'jwt[_-]?secret\s*[=:]\s*["\x27][^\x22\x27]{16,}' 'JWT secret'

          if [ "$FOUND" -eq 1 ]; then
            echo "Secret scanning found potential secrets — please review the diff."
            exit 1
          fi
          echo "No secrets detected."

  # ── Dependency vulnerability audit ──────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on HIGH or CRITICAL CVEs across all workspaces (root lockfile covers all)
      - name: Run npm audit
        run: npm audit --audit-level=high

  # ── SAST — CodeQL (GitHub's own action) ─────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.9
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4f3212b61783c3c68e8309a0f18a699764811cda # v3.27.9
        with:
          category: '/language:javascript-typescript'
