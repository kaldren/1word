name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.version_type }}" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

          update_json() {
            node -e "
              const fs = require('fs');
              const f = JSON.parse(fs.readFileSync('$1', 'utf8'));
              f.version = '$NEW';
              fs.writeFileSync('$1', JSON.stringify(f, null, 2) + '\n');
            "
          }
          update_json package.json
          update_json extension/package.json
          update_json server/package.json
          update_json extension/manifest.json
          update_json extension/manifest.firefox.json

      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json extension/package.json server/package.json \
                  extension/manifest.json extension/manifest.firefox.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Build Chrome extension
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build:ext

      - name: Build Firefox extension
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build:ext:firefox

      - name: Zip artifacts
        run: |
          VERSION=${{ steps.bump.outputs.new_version }}
          cd extension/dist-chrome && zip -r "../../1word-chrome-${VERSION}.zip" . && cd ../..
          cd extension/dist-firefox && zip -r "../../1word-firefox-${VERSION}.zip" . && cd ../..

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.bump.outputs.new_version }}
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --draft \
            --generate-notes \
            "1word-chrome-${VERSION}.zip" \
            "1word-firefox-${VERSION}.zip"
