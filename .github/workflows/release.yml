name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release may run at a time — prevents version file races
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 0. Security gate — build won't start if any check fails ─────────────────
  security:
    name: Security checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # ── 1. Bump version in all 5 files and push commit to main ──────────────────
  bump-version:
    name: Bump version
    needs: [security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the bump commit

    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Bump version in all 5 files
        id: bump
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$VERSION_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "New version: $NEW_VERSION"

          bump_json() {
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$1', 'utf8'));
              pkg.version = '${NEW_VERSION}';
              fs.writeFileSync('$1', JSON.stringify(pkg, null, 2) + '\n');
            "
            echo "  Updated $1"
          }

          bump_json "package.json"
          bump_json "extension/package.json"
          bump_json "server/package.json"
          bump_json "extension/manifest.json"
          bump_json "extension/manifest.firefox.json"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version bump
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git add \
            package.json \
            extension/package.json \
            server/package.json \
            extension/manifest.json \
            extension/manifest.firefox.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push origin main

  # ── 2. Build Chrome + Firefox extensions ────────────────────────────────────
  build:
    name: Build extensions
    needs: [bump-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      NEW_VERSION: ${{ needs.bump-version.outputs.new_version }}

    steps:
      - name: Checkout (post-bump commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main # pick up the bump commit just pushed

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Chrome extension
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build:ext

      - name: Build Firefox extension
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build:ext:firefox

      - name: Package Chrome zip
        run: |
          cd extension/dist-chrome
          zip -r "../../1word-chrome-${{ env.NEW_VERSION }}.zip" .

      - name: Package Firefox zip
        run: |
          cd extension/dist-firefox
          zip -r "../../1word-firefox-${{ env.NEW_VERSION }}.zip" .

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 1word-chrome-${{ env.NEW_VERSION }}
          path: 1word-chrome-${{ env.NEW_VERSION }}.zip
          retention-days: 7

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 1word-firefox-${{ env.NEW_VERSION }}
          path: 1word-firefox-${{ env.NEW_VERSION }}.zip
          retention-days: 7

  # ── 3. Create draft GitHub Release with both zips attached ──────────────────
  release:
    name: Create GitHub Release
    needs: [bump-version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create releases, push tags

    env:
      NEW_VERSION: ${{ needs.bump-version.outputs.new_version }}

    steps:
      - name: Checkout (for tagging)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Chrome artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b8d06fd8e4d21c3 # v4.1.8
        with:
          name: 1word-chrome-${{ env.NEW_VERSION }}

      - name: Download Firefox artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b8d06fd8e4d21c3 # v4.1.8
        with:
          name: 1word-firefox-${{ env.NEW_VERSION }}

      - name: Create and push release tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Create draft Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a7e09ce9571a6d0f2e98 # v2.2.1
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          draft: true # review and publish manually; artifacts are already attached
          prerelease: false
          body: |
            ## What's new in v${{ env.NEW_VERSION }}

            <!-- Add release notes here before publishing -->

            ### Store uploads
            Upload the zips below to the browser stores:
            | Browser | File |
            |---------|------|
            | Chrome / Edge | `1word-chrome-${{ env.NEW_VERSION }}.zip` |
            | Firefox | `1word-firefox-${{ env.NEW_VERSION }}.zip` |
          files: |
            1word-chrome-${{ env.NEW_VERSION }}.zip
            1word-firefox-${{ env.NEW_VERSION }}.zip
