name = "1word-server"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "1word_db"
database_id = "8c4c9c64-4f4c-469e-8626-b5ef206faa8b"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "chrome-extension://*,moz-extension://*"

# Secrets (set with `wrangler secret put <NAME>`):
#   OPENAI_API_KEY         - project-scoped key with hard spend cap set in OpenAI dashboard
#   JWT_SECRET             - random 32+ byte string; signs user session JWTs
#   GOOGLE_CLIENT_ID       - OAuth 2.0 client id from Google Cloud console
#   STRIPE_SECRET_KEY      - sk_live_... or sk_test_...
#   STRIPE_WEBHOOK_SECRET  - whsec_... from Stripe dashboard webhook
#   STRIPE_PRICE_ID_PRO    - price_... for the €5/mo Pro plan
#   PUBLIC_BASE_URL        - https://vocab-server.<account>.workers.dev, used for Stripe redirects
